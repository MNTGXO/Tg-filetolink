# Save as .github/workflows/deploy-worker.yml
#
# Repo secrets required (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   HMAC_SECRET            same value as on Koyeb
#   WORKER_SECRET          same value as on Koyeb
# Optional repo variable:
#   BACKEND_URL            Koyeb public URL (overrides wrangler.toml)

name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            npx --yes wrangler@3 deploy --var "BACKEND_URL:$BACKEND_URL"
          else
            npx --yes wrangler@3 deploy
          fi

      - name: Sync Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          printf '%s' "$HMAC_SECRET"   | npx --yes wrangler@3 secret put HMAC_SECRET
          printf '%s' "$WORKER_SECRET" | npx --yes wrangler@3 secret put WORKER_SECRET
          
