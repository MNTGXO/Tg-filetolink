name = "tg-file-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Your Koyeb public URL (no trailing slash). Edit before deploying.
BACKEND_URL = "https://nasty-wilhelmine-mnmovies-bf1db19f.koyeb.app"

# Optional keep-alive: pings /health every 30 minutes so Koyeb stays awake.
# Delete this block if you prefer scale-to-zero.
[triggers]
crons = ["*/30 * * * *"]

# Secrets (never put these in this file):
#   wrangler secret put HMAC_SECRET
#   wrangler secret put WORKER_SECRET
